services:
  - type: web
    name: listing-check
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CRON_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: listing-check-db
          property: connectionString
databases:
  - name: listing-check-db
    plan: free
